name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ORIENTATION: sensorLandscape

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android
        
      - name: Show SDK versions
        run: cat android/variables.gradle
        
      - name: Generate app icons (skipped automatically if it fails)
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a0a0c' --iconBackgroundColorDark '#0a0a0c' || echo "Icon generation skipped"

      - name: Set screen orientation
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i "s/android:name=\".MainActivity\"/android:name=\".MainActivity\" android:screenOrientation=\"$ORIENTATION\"/" "$MANIFEST"
          grep -n "screenOrientation" "$MANIFEST" || true

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk the-last-message.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: the-last-message-apk
          path: the-last-message.apk

      - name: Publish to GitHub Release (only when you push a tag like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: the-last-message.apk
