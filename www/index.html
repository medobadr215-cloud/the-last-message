<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>آخر رسالة — The Last Message · Sara Waleed</title>
<meta name="author" content="Sara Waleed">
<meta name="developer" content="Sara Waleed">
<meta name="publisher" content="Sara Waleed">
<meta name="description" content="آخر رسالة — The Last Message + الابن — The Son. A game by Sara Waleed. v1.3">
<meta name="apple-mobile-web-app-title" content="The Last Message">
<link rel="manifest" href="manifest.json">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a0c'/%3E%3Crect x='12' y='18' width='40' height='28' rx='3' fill='none' stroke='%23b89c5e' stroke-width='3'/%3E%3Cpath d='M12 21l20 15 20-15' fill='none' stroke='%23b89c5e' stroke-width='3'/%3E%3Ccircle cx='50' cy='16' r='5' fill='%235a1a1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;900&family=Cinzel:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0c;--char:#1a1a1f;--ash:#2a2a30;--fog:#4a4a52;--bone:#d4d0c8;--ghost:#8a8a92;
  --blood:#5a1a1a;--bloodb:#8a2a2a;--blue:#2a4a6a;--blueb:#4a7aa8;--gold:#6a5a3a;--goldb:#b89c5e;
  --sick:#3a4a3a;--ocean:#1a2a3a;
  --topH:64px;--botH:96px;--ts:1;
  --ease:cubic-bezier(.4,0,.2,1);
  --f-ar:'Cairo','Segoe UI',Tahoma,sans-serif;--f-ar-msg:'Amiri','Cairo',serif;--f-ar-title:'Cairo','Segoe UI',sans-serif;
  --f-en:'Lora',Georgia,serif;--f-en-title:'Cinzel',Georgia,serif;--f-en-msg:'Special Elite','Courier New',monospace;
}
html[lang=ar]{--f-body:var(--f-ar);--f-msg:var(--f-ar-msg);--f-title:var(--f-ar-title)}
html:not([lang=ar]){--f-body:var(--f-en);--f-msg:var(--f-en-msg);--f-title:var(--f-en-title)}
html.hc{--bone:#fff;--ghost:#d8d8d8;--fog:#9a9aa2}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--black);overflow:hidden;color:var(--bone);
  font-family:var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:var(--black)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.fx{position:absolute;inset:0;pointer-events:none}
#fxGrain{opacity:.13;animation:grain .6s steps(6) infinite;mix-blend-mode:overlay;z-index:2}
#fxVig{background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.72) 100%);z-index:2}
#fxFlash{background:#000;opacity:0;transition:opacity .8s var(--ease);z-index:60}
html.nograin #fxGrain{display:none}html.novig #fxVig{display:none}
@keyframes grain{0%{background-position:0 0}20%{background-position:-30px 20px}40%{background-position:25px -35px}60%{background-position:-15px -10px}80%{background-position:35px 25px}100%{background-position:0 0}}
.hidden{display:none!important}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .55s var(--ease),visibility .55s;z-index:10;display:flex}
.screen.on{opacity:1;visibility:visible;pointer-events:auto}
.over{z-index:30}
.btn{position:relative;background:var(--char);border:1px solid var(--fog);border-radius:4px;padding:14px 28px;font-weight:600;font-size:16px;letter-spacing:1.5px;color:var(--bone);cursor:pointer;
  transition:background .3s var(--ease),border-color .3s,color .3s;overflow:hidden;text-align:center;font-family:var(--f-body)}
.btn::after{content:"";position:absolute;left:50%;bottom:8px;width:0;height:1px;background:var(--goldb);transition:width .3s var(--ease),left .3s var(--ease)}
.btn:hover,.btn:focus-visible{background:var(--ash);border-color:var(--ghost)}
.btn:hover::after,.btn:focus-visible::after{width:46%;left:27%}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn:active,.btn.act{background:var(--gold);color:var(--black);border-color:var(--goldb)}
.btn:disabled,.btn.dis{opacity:.4;pointer-events:none}
.btn.sec{background:transparent}
.btn.sm{padding:10px 18px;font-size:14px}
.ibtn{width:48px;height:48px;border-radius:50%;background:var(--char);border:1px solid var(--fog);display:grid;place-items:center;cursor:pointer;position:relative;transition:background .3s,border-color .3s,transform .15s;padding:0}
.ibtn:hover{background:var(--ash);border-color:var(--ghost)}
.ibtn:active,.ibtn.act{background:var(--gold);border-color:var(--goldb)}
.ibtn svg{width:24px;height:24px;fill:none;stroke:var(--bone);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active svg,.ibtn.act svg{stroke:var(--black)}
.dot{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:var(--blueb);box-shadow:0 0 8px var(--blueb);display:none}
.dot.on{display:block}.dot.red{background:#b03a3a;box-shadow:0 0 8px #b03a3a}
.card{background:var(--char);border:1px solid var(--fog);border-radius:8px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:box-shadow .3s,border-color .3s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.6);border-color:var(--ghost)}
h1,h2,h3{font-family:var(--f-title);margin:0;letter-spacing:2px;line-height:1.2}

/* loading */
#s-load{background:radial-gradient(ellipse at center,#1a1a1f 0%,#0a0a0c 75%);flex-direction:column;align-items:center;justify-content:center;gap:28px;z-index:50;text-align:center;padding:24px}
#s-load .logo{font-family:var(--f-title);font-weight:900;font-size:72px;color:var(--bone);letter-spacing:4px;animation:flick 3s infinite}
#s-load .quote{font-size:18px;color:var(--ghost);font-style:italic;font-family:var(--f-msg);line-height:1.8}
#s-load .bar{width:400px;max-width:80vw;height:2px;background:var(--char)}
#s-load .bar i{display:block;height:100%;width:0;background:var(--goldb);transition:width .25s}
#s-load .pct{font-size:13px;color:var(--ghost);letter-spacing:2px;min-height:20px}
#s-load .ver{position:absolute;bottom:18px;font-size:12px;color:var(--fog);letter-spacing:2px}
#tapgo{animation:breathe 2.4s infinite}
@keyframes flick{0%,89%,100%{opacity:1}90%{opacity:.35}91%{opacity:1}93%{opacity:.5}94%{opacity:1}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}

/* menu */
#s-menu{background:var(--black);direction:ltr;flex-direction:row}
#menuArtBox{flex:0 0 40%;position:relative;overflow:hidden;border-right:1px solid #15151a}
#menuArt{position:absolute;inset:0;width:100%;height:100%}
.menuPanel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 32px;gap:14px;direction:var(--dir,rtl);overflow:auto;position:relative}
html[dir=rtl] .menuPanel{direction:rtl}html[dir=ltr] .menuPanel{direction:ltr}
.menuPanel h1{font-weight:900;font-size:60px;color:var(--bone);text-align:center}
.menuPanel h1 small{display:block;font-size:20px;color:var(--ghost);margin-top:8px;letter-spacing:6px;font-weight:700}
.goldline{width:120px;height:1px;background:var(--goldb);margin:6px auto;box-shadow:0 0 12px rgba(184,156,94,.5)}
.tag{color:var(--ghost);font-size:16px;text-align:center;margin-bottom:10px}
.menuBtns{display:flex;flex-direction:column;gap:10px;width:min(340px,100%)}
.menuFoot{margin-top:12px;display:flex;gap:16px;align-items:center;color:var(--ghost);font-size:13px;letter-spacing:1.5px}
.menuFoot .btn{padding:6px 14px;font-size:13px}
@media (max-width:767px),(orientation:portrait){
  #s-menu{flex-direction:column}
  #menuArtBox{flex:0 0 36%;border-right:0;border-bottom:1px solid #15151a}
  .menuPanel{justify-content:flex-start;padding:14px 16px;gap:6px}
  .menuPanel h1{font-size:36px}.menuPanel h1 small{font-size:14px;margin-top:2px;letter-spacing:4px}
  .menuBtns{gap:8px}.btn{padding:11px 22px}.goldline{margin:2px auto}.tag{margin-bottom:4px;font-size:14px}.menuFoot{margin-top:4px}
}
@media (max-height:720px) and (orientation:portrait){.btn{padding:8px 18px;font-size:15px}.menuPanel h1{font-size:30px}}
@media (max-height:520px) and (orientation:landscape){
  .menuPanel{gap:6px;padding:10px 20px}.menuPanel h1{font-size:34px}.menuPanel h1 small{font-size:13px;margin-top:2px}
  .tag{margin-bottom:2px;font-size:13px}
  .menuBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(480px,100%)}
  .menuBtns .btn{padding:9px 12px;font-size:14px}.goldline{margin:2px auto}
}

/* generic panel screens */
.panelScr{background:rgba(10,10,12,.96);flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 20px) 20px 20px;overflow:auto;touch-action:pan-y}
.panelScr .ph{width:min(920px,100%);display:flex;align-items:center;gap:14px;margin-bottom:18px}
.panelScr .ph h2{flex:1;font-size:30px}
.panelScr .pb{width:min(920px,100%);flex:1}
#chGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:1023px){#chGrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){#chGrid{grid-template-columns:1fr}.panelScr .ph h2{font-size:24px}}
.chCard{padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative}
.chCard .art{height:110px;position:relative;display:grid;place-items:center;font-family:var(--f-en-title);font-size:46px;font-weight:900;color:rgba(212,208,200,.55)}
.chCard .art::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.6))}
.chCard .info{padding:14px 18px 18px}
.chCard h3{font-size:20px;margin-bottom:6px}
.chCard p{margin:0 0 10px;font-size:14px;color:var(--ghost);line-height:1.6}
.chCard .st{font-size:12px;letter-spacing:1px;color:var(--goldb)}
.chCard.lock{filter:grayscale(1) brightness(.55);cursor:not-allowed}
.chCard.lock .st{color:var(--ghost)}
.chCard.done .st{color:#8aa88a}
.chCard:hover:not(.lock){border-color:var(--goldb)}

/* settings */
.acc{border:1px solid var(--fog);border-radius:8px;margin-bottom:10px;background:var(--char);overflow:hidden}
.acc>button{width:100%;background:none;border:0;padding:16px 20px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:var(--f-body)}
.acc>button::after{content:"＋";color:var(--goldb);font-weight:400}
.acc.open>button::after{content:"－"}
.acc .body{display:none;padding:4px 20px 18px;gap:16px;flex-direction:column}
.acc.open .body{display:flex}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.row label{font-size:15px;color:var(--bone)}
.seg{display:flex;border:1px solid var(--fog);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 14px;font-size:14px;cursor:pointer;border-inline-end:1px solid var(--fog);font-family:var(--f-body)}
.seg button:last-child{border-inline-end:0}
.seg button.on{background:var(--gold);color:var(--black);font-weight:700}
input[type=range]{width:min(220px,50vw);accent-color:var(--goldb)}
.tog{width:52px;height:28px;border-radius:14px;background:var(--ash);border:1px solid var(--fog);position:relative;cursor:pointer;padding:0;transition:background .3s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ghost);transition:transform .3s var(--ease),background .3s}
.tog.on{background:var(--gold)}.tog.on::after{transform:translateX(24px);background:var(--bone)}
.note{font-size:13px;color:var(--ghost);line-height:1.6}

/* about */
.aboutTxt{font-size:16px;line-height:1.9;color:var(--bone)}
.aboutTxt h3{margin:18px 0 8px;color:var(--goldb);font-size:20px}
.achGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:640px){.achGrid{grid-template-columns:1fr}}
.ach{padding:12px 16px;border:1px solid var(--fog);border-radius:8px;background:var(--char);display:flex;gap:12px;align-items:center;opacity:.45}
.ach.on{opacity:1;border-color:var(--goldb)}
.ach b{display:block;font-size:15px}.ach span{font-size:13px;color:var(--ghost)}
.ach i{font-style:normal;font-size:22px;color:var(--goldb)}

/* slots */
#s-slots{background:rgba(10,10,12,.92);align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;z-index:35}
.slotRow{width:min(560px,100%);display:flex;gap:10px;align-items:stretch}
.slotRow .card{flex:1;cursor:pointer;padding:16px 20px}
.slotRow .card b{font-size:17px}.slotRow .card div{font-size:13px;color:var(--ghost);margin-top:4px}
.slotRow .card.empty{opacity:.65}
.slotRow .del{width:46px;flex:none;padding:0}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:20;direction:ltr;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
#hud.on{opacity:1;visibility:visible}
#hudTop{position:absolute;left:0;right:0;top:0;height:var(--topH);background:rgba(10,10,12,.8);display:flex;align-items:center;justify-content:space-between;padding:0 16px;padding-top:env(safe-area-inset-top);pointer-events:auto;border-bottom:1px solid #15151a}
#hudBot{position:absolute;left:0;right:0;bottom:0;height:var(--botH);background:rgba(10,10,12,.8);display:flex;align-items:center;justify-content:space-between;padding:0 18px;padding-bottom:env(safe-area-inset-bottom);pointer-events:auto;border-top:1px solid #15151a}
.hudL,.hudR,.hudC{display:flex;align-items:center;gap:10px}
#heartBtn{width:auto;border-radius:24px;padding:0 14px;gap:8px;font-size:14px;color:var(--bone);display:flex;align-items:center}
#heartBtn svg{width:22px;height:22px;stroke:#a04a4a;fill:rgba(90,26,26,.5);animation:beat 1.8s infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}40%{transform:scale(1.12)}}
#torchBtn.on{background:var(--gold);border-color:var(--goldb);box-shadow:0 0 16px rgba(184,156,94,.5)}
#torchBtn.on svg{stroke:var(--black)}
.bb{width:64px;height:64px}.bb svg{width:30px;height:30px}
#bInt.glow{border-color:var(--goldb);box-shadow:0 0 22px rgba(184,156,94,.7);animation:glowp 1.3s infinite}
@keyframes glowp{50%{box-shadow:0 0 6px rgba(184,156,94,.3)}}
.walkPair{display:flex;gap:10px}
#inv{position:absolute;top:calc(var(--topH) + 8px);left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none;flex-wrap:wrap;justify-content:center;max-width:90vw}
.invI{width:38px;height:38px;border-radius:8px;background:rgba(26,26,31,.85);border:1px solid var(--fog);display:grid;place-items:center;font-size:19px;animation:pop .4s var(--ease)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#prompt{position:absolute;left:50%;bottom:calc(var(--botH) + 14px);transform:translateX(-50%);background:rgba(10,10,12,.82);border:1px solid var(--gold);border-radius:20px;padding:7px 18px;font-size:15px;color:var(--bone);opacity:0;transition:opacity .25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;direction:var(--dir)}
#prompt.on{opacity:1}
html[dir=rtl] #prompt{direction:rtl}
#toast{position:absolute;left:50%;top:calc(var(--topH) + 56px);transform:translate(-50%,-10px);background:rgba(26,26,31,.95);border:1px solid var(--goldb);border-radius:8px;padding:10px 20px;font-size:15px;opacity:0;transition:opacity .4s,transform .4s;z-index:70;pointer-events:none;text-align:center;max-width:88vw;box-shadow:0 4px 16px rgba(0,0,0,.6)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.red{border-color:#8a2a2a}
#toast.blue{border-color:var(--blueb)}

/* dialog */
#dlg{background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(var(--botH) + 12px);z-index:40}
.dlgbox{width:min(800px,100%);min-height:160px;background:rgba(10,10,12,.95);border:1px solid var(--fog);border-radius:8px;padding:20px 24px;box-shadow:0 8px 32px rgba(0,0,0,.8);position:relative;cursor:pointer}
#dlgName{font-family:var(--f-title);font-weight:700;font-size:calc(22px*var(--ts));color:var(--bone);margin-bottom:8px;letter-spacing:1px}
#dlgName.l{color:#c9b27a}#dlgName.u{color:#b05a5a}#dlgName.n{display:none}
#dlgText{font-family:var(--f-body);font-size:calc(19px*var(--ts));line-height:1.8;min-height:calc(1.8em*2);color:var(--bone)}
#dlgText.i{font-style:italic;color:var(--ghost)}
#dlgNext{position:absolute;bottom:10px;inset-inline-end:16px;color:var(--goldb);animation:breathe 1.2s infinite;opacity:0}
#dlgBtns{position:absolute;top:-44px;inset-inline-end:0;display:flex;gap:8px}
#dlgBtns .btn{padding:6px 14px;font-size:13px;background:rgba(10,10,12,.9)}
#logPanel{position:absolute;inset:0;background:rgba(10,10,12,.97);z-index:45;padding:60px 20px 20px;overflow:auto;touch-action:pan-y;display:none}
#logPanel.on{display:block}
#logPanel .li{max-width:700px;margin:0 auto 14px;line-height:1.7;font-size:16px}
#logPanel .li b{display:block;font-size:13px;color:var(--goldb);letter-spacing:1px}

/* phone */
#s-phone{background:rgba(0,0,0,.72);align-items:center;justify-content:center;z-index:42}
.phoneBody{width:min(375px,calc(100vw - 24px));height:min(780px,calc(100% - 24px));background:#06090c;border:2px solid #1d2733;border-radius:34px;box-shadow:0 0 0 6px #0d1218,0 0 50px rgba(42,74,106,.35),0 20px 60px #000;display:flex;flex-direction:column;overflow:hidden;position:relative;direction:var(--dir)}
html[dir=rtl] .phoneBody{direction:rtl}
.phStat{display:flex;justify-content:space-between;padding:14px 26px 6px;font-size:13px;color:#8aa0b8;letter-spacing:1px;direction:ltr}
.phHead{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;border-bottom:1px solid #121b25}
.phHead h3{flex:1;font-size:19px;color:#c3d0de}
.phList{flex:1;overflow:auto;padding:8px 12px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.phList.hidden,.msgView.hidden{display:none!important}
.msgRow{display:flex;gap:12px;align-items:center;padding:14px 12px;border-radius:12px;cursor:pointer;border-bottom:1px solid #0e151d;position:relative}
.msgRow:hover{background:#0c141c}
.msgRow .av{width:42px;height:42px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-weight:700;color:#dce8f4;flex:none}
.msgRow.u .av{background:var(--blood);color:#e8c0c0}
.msgRow .mt b{display:block;font-size:15px;color:#d8e2ec}.msgRow .mt span{font-size:13px;color:#7a8ea4;display:block;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgRow .nd{width:10px;height:10px;border-radius:50%;background:var(--blueb);margin-inline-start:auto;flex:none;box-shadow:0 0 8px var(--blueb)}
.msgRow.u .nd{background:#b03a3a;box-shadow:0 0 8px #b03a3a}
.msgView{flex:1;overflow:auto;padding:22px 24px;font-family:var(--f-msg);font-size:calc(19px*var(--ts));line-height:1.9;color:#cfd8e2;touch-action:pan-y;-webkit-overflow-scrolling:touch;max-height:100%;box-sizing:border-box}
.msgView .from{font-family:var(--f-body);font-size:13px;color:#7a8ea4;margin-bottom:14px;letter-spacing:1px}
.msgView.u{color:#d6aaaa}
.phFoot{padding:12px 16px 18px;border-top:1px solid #121b25;display:flex;gap:10px;justify-content:center}
.phFoot .btn{font-size:14px;padding:10px 18px}
#phTorch.on{background:var(--gold);color:var(--black);border-color:var(--goldb)}

/* memory */
#s-mem{z-index:44;background:#050505;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;filter:grayscale(1)}
#s-mem .grain2{position:absolute;inset:0;width:100%;height:100%;opacity:.11;mix-blend-mode:screen;pointer-events:none;image-rendering:pixelated}
#s-mem h3{font-style:italic;font-size:32px;color:#cfcfcf;letter-spacing:6px;animation:fadeIn 2s}
html[lang=ar] #s-mem h3{font-style:normal}
#s-notes,#s-map{z-index:56}
#memFig{width:min(520px,90vw);height:min(250px,34vh);position:relative;filter:blur(1.2px);animation:memBlur 6s infinite alternate}
@keyframes memBlur{from{filter:blur(2.4px)}to{filter:blur(.6px)}}
#memTxt{width:min(680px,92vw);min-height:110px;text-align:center;font-family:var(--f-msg);font-size:calc(21px*var(--ts));line-height:1.9;color:#e4e4e4}
#memTxt b{display:block;font-family:var(--f-body);font-size:13px;color:#9a9a9a;letter-spacing:2px;margin-bottom:4px}
#memSkip{position:absolute;top:calc(env(safe-area-inset-top) + 14px);inset-inline-end:16px;background:rgba(0,0,0,.6)}
@keyframes fadeIn{from{opacity:0}}

/* doc */
#s-doc{z-index:43;background:rgba(0,0,0,.78);align-items:center;justify-content:center;padding:18px;flex-direction:column}
.paper{width:min(560px,100%);max-height:86%;overflow:auto;background:#d4d0c8;color:#1a1a1f;border-radius:4px;padding:28px 30px;box-shadow:0 12px 50px #000;font-family:var(--f-msg);font-size:calc(20px*var(--ts));line-height:1.95;touch-action:pan-y;position:relative}
.paper h4{margin:0 0 12px;font-family:var(--f-body);font-size:13px;letter-spacing:2px;color:#6a5a3a;text-transform:uppercase}
.paper.file{background:#cfd6cf;font-family:var(--f-en-msg);font-size:calc(17px*var(--ts))}
.paper.him{background:#c9c4b8}
#docClose{margin-top:16px}

/* puzzles */
#s-pz{z-index:46;background:rgba(0,0,0,.82);align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:16px}
.pzBox{width:min(560px,100%);background:var(--char);border:1px solid var(--fog);border-radius:12px;padding:24px;box-shadow:0 8px 32px #000;text-align:center;max-height:92%;overflow:auto}
.pzBox h3{font-size:24px;margin-bottom:6px}
.pzBox p{color:var(--ghost);font-size:15px;line-height:1.7;margin:0 0 16px}
.pinDisp{display:flex;gap:10px;justify-content:center;margin-bottom:16px;direction:ltr}
.pinDisp i{width:46px;height:58px;border:1px solid var(--fog);border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:28px;font-family:var(--f-en-msg);background:var(--black);color:var(--goldb)}
.pzBox .keys{direction:ltr!important}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin-bottom:14px;direction:ltr}
.keys button{height:58px;font-size:22px;font-family:var(--f-en-msg);background:var(--ash);border:1px solid var(--fog);border-radius:8px;cursor:pointer}
.keys button:active{background:var(--gold);color:var(--black)}
.pzMsg{min-height:22px;color:#c07a7a;font-size:14px;margin-bottom:8px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.txtIn{width:100%;background:var(--black);border:1px solid var(--fog);border-radius:6px;padding:14px;font-size:22px;color:var(--bone);text-align:center;font-family:var(--f-body);letter-spacing:3px;margin-bottom:12px;-webkit-user-select:text;user-select:text}
.txtIn:focus{outline:2px solid var(--blue)}
.pzBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.photoRow{display:flex;gap:10px;justify-content:center;margin-bottom:12px;direction:ltr}
.pho{width:30%;max-width:150px;aspect-ratio:3/4;perspective:700px;cursor:pointer;position:relative}
.pho .in{position:absolute;inset:0;transition:transform .6s var(--ease);transform-style:preserve-3d}
.pho.flip .in{transform:rotateY(180deg)}
.pho .f,.pho .b{position:absolute;inset:0;border-radius:4px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border:3px solid #cfc9b8}
.pho .f{background:#222}
.pho .f svg{width:100%;height:100%}
.pho .b{background:#b8b09a;color:#2a2418;transform:rotateY(180deg);font-family:var(--f-en-msg);font-size:16px;flex-direction:column;gap:6px}
.pho.sel{outline:3px solid var(--goldb);outline-offset:3px}
.pho .pos{position:absolute;top:-10px;left:-6px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#000;font-weight:900;display:grid;place-items:center;z-index:2;font-size:14px}
.pho .fb{position:absolute;bottom:-34px;left:0;right:0;text-align:center}
.slotLab{display:flex;justify-content:space-between;font-size:12px;color:var(--ghost);margin:0 4px 8px;direction:ltr;letter-spacing:1px}

/* charge */
.charge{width:min(420px,100%);text-align:center}
.sun{width:140px;height:140px;margin:0 auto 20px;border-radius:50%;background:radial-gradient(circle,#ffe9a8 0%,#e0b45a 40%,rgba(224,180,90,0) 70%);animation:sunp 2.5s infinite}
@keyframes sunp{50%{transform:scale(1.15);opacity:.8}}
.batt{width:200px;height:56px;border:3px solid var(--bone);border-radius:10px;margin:0 auto;position:relative;padding:4px;direction:ltr}
.batt::after{content:"";position:absolute;right:-12px;top:16px;width:8px;height:20px;background:var(--bone);border-radius:0 3px 3px 0}
.batt i{display:block;height:100%;width:2%;background:#c9a24a;border-radius:4px;transition:width .2s}

/* cine / title */
#s-cine{z-index:48;background:transparent;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}
#s-cine.on{pointer-events:auto}
#cineBg{position:absolute;inset:0;background:#000;opacity:1;transition:opacity 1.2s}
#cineTxt{position:relative;font-family:var(--f-msg);font-size:calc(26px*var(--ts));line-height:1.9;color:var(--bone);max-width:min(720px,92vw);min-height:3em;transition:opacity 1s;opacity:0}
#cineTxt.on{opacity:1}
#cineTitle{position:relative;font-family:var(--f-title);font-weight:900;font-size:68px;letter-spacing:5px;color:var(--bloodb);opacity:0;text-shadow:0 0 24px rgba(138,42,42,.7)}
#cineTitle.on{opacity:1;animation:flick 2.4s infinite}
#cineSub{position:relative;font-family:var(--f-title);font-size:24px;color:var(--ghost);margin-top:16px;letter-spacing:6px;opacity:0;transition:opacity 1.5s}
#cineSub.on{opacity:1}
#cineSkip{position:absolute;top:calc(env(safe-area-inset-top) + 14px);inset-inline-end:16px;pointer-events:auto;opacity:.8;background:rgba(0,0,0,.5)}
#cinePhone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);width:min(320px,86vw);aspect-ratio:9/16;max-height:80vh;background:#06090c;border:2px solid #1d2733;border-radius:28px;box-shadow:0 0 40px rgba(42,74,106,.5);opacity:0;transition:opacity 1s,transform 6s linear;padding:24px 22px;text-align:start;direction:var(--dir);overflow:hidden}
html[dir=rtl] #cinePhone{direction:rtl}
#cinePhone.on{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
#cinePhone .nt{background:#0e1a26;border:1px solid var(--blue);border-radius:12px;padding:12px 14px;font-size:14px;color:#a8c0d8;margin-bottom:16px;transform:translateY(-12px);opacity:0;transition:all .5s}
#cinePhone .nt.on{transform:none;opacity:1}
#cinePhone .mm{font-family:var(--f-msg);font-size:19px;line-height:1.9;color:#cfd8e2}
.glitch{animation:glitch .6s steps(2) 3;color:var(--bloodb)!important}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-4px,2px);filter:hue-rotate(90deg)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-3px);filter:invert(.2)}100%{transform:none}}

/* pause / end */
#s-pause{z-index:50;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center;flex-direction:column;gap:10px}
#s-pause h2{margin-bottom:14px;font-size:34px}
#s-pause .btn{width:min(320px,86vw)}
#s-pause{overflow-y:auto;justify-content:safe center;-webkit-overflow-scrolling:touch}
#s-pause .btn,#s-end .btn{flex:none}
#s-end{overflow-y:auto;justify-content:safe center}
@media (max-height:560px){
  #s-pause{display:grid;grid-template-columns:repeat(2,minmax(0,190px));justify-content:center;align-content:safe center;gap:8px 10px;padding:calc(env(safe-area-inset-top) + 6px) 16px 6px}
  #s-pause h2{grid-column:1/-1;margin:0;font-size:24px;text-align:center;line-height:1.2}
  #s-pause .btn{width:100%;min-height:38px;padding:8px 10px;font-size:14px;line-height:1.2;letter-spacing:.5px}
  #s-pause>div{grid-column:1/-1;width:100%!important;gap:10px!important}
  #s-end{gap:8px;padding:10px 20px}
  #s-end h1{font-size:40px}
  #s-end p{font-size:16px;margin:0 0 6px}
  #s-end .btn{min-height:38px;padding:8px 14px;font-size:14px}
}
#s-end{z-index:52;background:#000;align-items:center;justify-content:flex-start;flex-direction:column;gap:18px;text-align:center;padding:20px;overflow-y:auto}
#s-end>:first-child{margin-top:auto}#s-end>:last-child{margin-bottom:auto}
#s-end h1{font-size:76px;font-weight:900;color:var(--bloodb);animation:flick 3s infinite;text-shadow:0 0 30px rgba(138,42,42,.6)}
#s-end p{font-size:22px;color:var(--ghost);margin:0 0 20px;font-family:var(--f-msg)}
#s-end .btn{width:min(300px,86vw)}
#s-bye{z-index:58;background:#000;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center}
#s-bye p{font-size:24px;font-family:var(--f-msg);color:var(--ghost)}
#hint{position:absolute;left:50%;bottom:calc(var(--botH) + 60px);transform:translateX(-50%);background:rgba(10,10,12,.9);border:1px solid var(--blue);border-radius:10px;padding:10px 18px;font-size:15px;max-width:90vw;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none;z-index:25}
#hint.on{opacity:1}

@media (max-width:767px){
  :root{--topH:56px;--botH:88px}
  #s-load .logo{font-size:42px}
  .menuPanel h1{font-size:36px}
  .bb{width:58px;height:58px}
  #dlgText{min-height:calc(1.8em*3)}
  .dlgbox{min-height:140px;padding:16px 18px}
  #cineTitle{font-size:44px}#s-end h1{font-size:48px}
  .keys{grid-template-columns:repeat(3,64px)}
}
@media (min-width:768px) and (max-width:1023px){:root{--topH:60px;--botH:92px}}
@media (max-height:480px) and (orientation:landscape){
  :root{--topH:48px;--botH:70px}
  .bb{width:50px;height:50px}.ibtn{width:40px;height:40px}
  #dlg{padding-bottom:calc(var(--botH) + 4px)}.dlgbox{min-height:110px;padding:12px 18px}
  #dlgText{min-height:calc(1.8em*2)}
  .phoneBody{height:calc(100% - 12px)}
}
html.reduce *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}

/* ===== v1.1 / v1.2 additions ===== */
#cineMsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,88vw);font-family:var(--f-msg);font-size:calc(24px*var(--ts));line-height:2;color:var(--bone);text-align:start;direction:var(--dir);opacity:0;transition:opacity .6s;pointer-events:none;white-space:pre-wrap}
html[dir=rtl] #cineMsg{direction:rtl}#cineMsg.on{opacity:1}
#cineMsg::after{content:'▌';color:var(--goldb);animation:breathe .8s infinite}#cineMsg.done::after{content:''}
.ccNum{font-family:var(--f-ar-title);font-weight:700;font-size:24px;color:var(--goldb);letter-spacing:4px}
html:not([lang=ar]) .ccNum{font-family:var(--f-en-title)}
.ccLine{height:2px;width:0;background:var(--goldb);margin:16px auto;transition:width 1.6s var(--ease);box-shadow:0 0 12px rgba(184,156,94,.6)}
.ccName{font-family:var(--f-ar-title);font-weight:900;font-size:calc(48px*var(--ts));color:var(--bone);letter-spacing:3px}
html:not([lang=ar]) .ccName{font-family:'Cinzel',Georgia,serif}
#cineTxt.cc.flick{animation:flick 1.6s infinite}
@media (max-width:767px){.ccName{font-size:34px}}
#dlgName.a{color:#d9c48a}#dlgText.a{font-family:var(--f-msg);font-style:italic;color:#d8d4c6;border-inline-start:2px solid var(--goldb);padding-inline-start:12px}
#dlgText.rec{font-family:var(--f-msg);color:#cfd8e2}

html.night{--black:#050506;--char:#0f0f12;--ash:#1b1b20;--bone:#b8b4ac;--ghost:#767680;--blueb:#3c5f80;--blue:#22384e;--goldb:#a88c52}
html.night #cv{filter:sepia(.22) saturate(.85) hue-rotate(-10deg) brightness(.9)}
html.night #app::after{content:"";position:absolute;inset:0;background:rgba(60,34,8,.10);pointer-events:none;z-index:59;mix-blend-mode:multiply}
.creditLine{font-family:var(--f-en);font-style:italic;font-size:13px;color:#e8e8ee;letter-spacing:1px;opacity:.9}
#s-load .by{position:absolute;bottom:40px;font-family:var(--f-en);font-style:italic;font-size:13px;color:#e8e8ee;letter-spacing:1.5px}
.partSw{display:flex;border:1px solid var(--fog);border-radius:6px;overflow:hidden;width:min(340px,100%);margin-bottom:6px}
.partSw button{flex:1;background:transparent;border:0;padding:9px 6px;font-size:13px;cursor:pointer;font-family:var(--f-body);color:var(--ghost);line-height:1.3}
.partSw button.on{background:var(--gold);color:var(--black);font-weight:700}
.partSw button+button{border-inline-start:1px solid var(--fog)}
html[data-part="2"] .menuPanel h1{color:var(--bloodb)}
/* achievement toast */
#achToast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-140%);background:var(--char);border:1.5px solid var(--goldb);border-radius:10px;padding:10px 20px;display:flex;gap:12px;align-items:center;z-index:80;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.8),0 0 22px rgba(184,156,94,.25);transition:transform .55s var(--ease);max-width:92vw}
#achToast.on{transform:translate(-50%,0)}
#achToast i{font-style:normal;font-size:30px;color:var(--goldb);animation:starSpin 1.2s ease-out}
#achToast b{display:block;font-size:15px;color:var(--bone)}#achToast span{font-size:12px;color:var(--ghost)}
@keyframes starSpin{from{transform:rotate(-200deg) scale(.2)}to{transform:none}}
/* timer + bars */
#spTimer{position:absolute;top:calc(var(--topH) + 6px);right:12px;font-family:'Special Elite','Courier New',monospace;font-size:18px;color:var(--goldb);letter-spacing:2px;text-shadow:0 0 8px rgba(0,0,0,.9);display:none;pointer-events:none;direction:ltr}
#spTimer.on{display:block}
#bars{position:absolute;top:calc(var(--topH) + 8px);left:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;direction:ltr;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
#bars.on{opacity:1;visibility:visible}
#hpRow{display:flex;gap:4px}#hpRow i{width:18px;height:18px;background:#8a2a2a;clip-path:polygon(50% 100%,0 35%,15% 10%,50% 25%,85% 10%,100% 35%);opacity:1;transition:opacity .3s}
#hpRow i.off{opacity:.18}
#stBar{width:96px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}#stBar b{display:block;height:100%;width:100%;background:#c9a24a;transition:width .1s}
#stBar2{width:96px;height:4px;margin-top:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;display:none}#stBar2.on{display:block}#stBar2 b{display:block;height:100%;width:100%;background:#6f93b8;transition:width .1s}
#hintBtn .cnt,#hudMore .cnt{position:absolute;bottom:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#000;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
#actBtns{position:absolute;right:12px;bottom:calc(var(--botH) + 12px);display:flex;flex-direction:column;gap:8px;pointer-events:auto;direction:ltr;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
#actBtns.on{opacity:1;visibility:visible}
#actBtns .ibtn{width:46px;height:46px;font-size:11px;font-weight:700;letter-spacing:0}
#actBtns .ibtn.act{background:var(--gold);color:#000}
#actBtns .ibtn span{font-size:20px;line-height:1}
#aSwitch,#aRevive{display:none}#aSwitch.on,#aRevive.on{display:grid;place-items:center}#aSwitch span,#aRevive span{display:block;text-align:center;line-height:1;transform:translateY(-1px)}#aRevive{background:#2f6b45;color:#fff;border-color:#6ac07a;animation:rvPulse 1s infinite}@keyframes rvPulse{50%{box-shadow:0 0 14px #6ac07a}}
#whoNow{font-size:12px;letter-spacing:1px;color:var(--goldb);text-shadow:0 0 6px rgba(0,0,0,.9);display:none}#whoNow.on{display:block}
#vigAlert{position:absolute;inset:0;pointer-events:none;z-index:21;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,transparent 45%,rgba(138,26,26,.55) 100%)}
#vigAlert.on{opacity:1}
#vigHit{position:absolute;inset:0;pointer-events:none;z-index:22;opacity:0;background:rgba(160,20,20,.35)}
#vigHit.on{animation:hitf .4s}
@keyframes hitf{from{opacity:1}to{opacity:0}}
/* extras / panels */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--char);border:1px solid var(--fog);border-radius:20px;padding:8px 16px;font-size:14px;cursor:pointer;font-family:var(--f-body)}
.tabs button.on{background:var(--gold);color:#000;border-color:var(--goldb);font-weight:700}
.exGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:640px){.exGrid{grid-template-columns:1fr 1fr;gap:10px}}
.exCard{padding:18px 14px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.exCard .ic{font-size:30px}.exCard b{font-size:16px}.exCard span{font-size:12px;color:var(--ghost)}
.exCard:hover{border-color:var(--goldb)}
.stGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stCard{background:var(--char);border:1px solid var(--fog);border-radius:8px;padding:14px;text-align:center}
.stCard b{display:block;font-size:24px;color:var(--goldb);font-family:'Special Elite','Courier New',monospace;direction:ltr}
.stCard span{font-size:12px;color:var(--ghost)}
.secH{margin:22px 0 10px;color:var(--goldb);font-size:18px;font-family:var(--f-title)}
.galGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.galItem{border:1px solid var(--fog);border-radius:8px;overflow:hidden;background:var(--char);cursor:pointer;position:relative}
.galItem .th{height:96px;background:#111;position:relative;filter:grayscale(1)}
.galItem .th svg{width:100%;height:100%}
.galItem.lock{opacity:.4;cursor:default}.galItem.lock .th{filter:grayscale(1) brightness(.2)}
.galItem .cap{padding:8px 10px;font-size:13px}
.recRow{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--fog);border-radius:8px;background:var(--char);margin-bottom:8px;cursor:pointer}
.recRow.lock{opacity:.4;cursor:default}.recRow i{font-style:normal;font-size:22px}
.sndRow{display:flex;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--fog);border-radius:8px;background:var(--char);margin-bottom:6px;cursor:pointer}
.sndRow.on{border-color:var(--goldb);background:var(--ash)}.sndRow i{font-style:normal;color:var(--goldb);width:22px;text-align:center}
#sndBar{position:sticky;bottom:0;background:rgba(10,10,12,.96);border:1px solid var(--goldb);border-radius:10px;padding:12px 14px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
#sndBar .prog{height:4px;background:var(--ash);border-radius:2px;overflow:hidden}#sndBar .prog i{display:block;height:100%;width:0;background:var(--goldb)}
#sndBar .ctl{display:flex;gap:8px;align-items:center;justify-content:center}
.noteItem{border-inline-start:3px solid var(--goldb);padding:10px 14px;background:var(--char);border-radius:0 8px 8px 0;margin-bottom:8px;line-height:1.7;font-family:var(--f-msg);font-size:calc(17px*var(--ts))}
html[dir=rtl] .noteItem{border-radius:8px 0 0 8px}
.noteItem small{display:block;color:var(--ghost);font-family:var(--f-body);font-size:11px;letter-spacing:1px}
.noteItem.new{animation:pop .6s}
#mapSvg{width:100%;max-width:760px;display:block;margin:0 auto;background:var(--char);border:1px solid var(--fog);border-radius:10px}
.charCard{display:flex;gap:14px;padding:14px;border:1px solid var(--fog);border-radius:10px;background:var(--char);margin-bottom:10px}
.charCard .av{width:64px;height:64px;border-radius:50%;background:var(--ash);flex:none;display:grid;place-items:center;font-size:28px;border:1px solid var(--goldb)}
.charCard b{font-size:17px}.charCard p{margin:4px 0;font-size:13px;color:var(--ghost);line-height:1.7}
.charCard.lock{opacity:.45}
.chalRow{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--fog);border-radius:8px;background:var(--char);margin-bottom:8px;opacity:.55}
.chalRow.on{opacity:1;border-color:var(--goldb)}.chalRow i{font-style:normal;font-size:20px;color:var(--goldb)}
.newsItem{padding:12px 16px;border:1px solid var(--fog);border-radius:8px;background:var(--char);margin-bottom:10px;line-height:1.8}
.newsItem b{color:var(--goldb)}
/* credits / decision */
#s-credits{z-index:57;background:#000;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;gap:18px}
#s-credits .t1{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:48px;color:var(--bone);opacity:0;transition:opacity 1.6s}
html[lang=ar] #s-credits .t1{font-family:var(--f-ar-title);font-weight:900}
#s-credits .t2{font-family:var(--f-en);font-size:24px;color:#e8e8ee;line-height:2;opacity:0;transition:opacity 1.4s}
#s-credits .t3{font-family:var(--f-en);font-size:18px;color:var(--fog);opacity:0;transition:opacity 1.2s}
#s-credits .t4{font-family:'Cinzel',Georgia,serif;font-weight:900;font-size:76px;color:var(--bloodb);opacity:0;transition:opacity 1.4s;text-shadow:0 0 30px rgba(138,42,42,.6)}
html[lang=ar] #s-credits .t4{font-family:var(--f-ar-title)}
#s-credits .on{opacity:1}#s-credits .t4.on{animation:flick 2.4s infinite}
@media (max-width:767px){#s-credits .t1{font-size:32px}#s-credits .t2{font-size:18px}#s-credits .t4{font-size:48px}}
.endBy{font-family:var(--f-en);font-style:italic;font-size:15px;color:#e8e8ee;margin:-8px 0 14px}
.decide{display:flex;flex-direction:column;gap:10px;width:100%}
.decide .btn{text-align:start;padding:14px 18px}
.decide .btn small{display:block;font-weight:400;font-size:12px;color:var(--ghost);letter-spacing:0;margin-top:3px}
.orderRow{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap;direction:ltr}
.piece{width:min(30%,150px);aspect-ratio:1;background:#2a241a;border:2px solid #4a3d28;border-radius:4px;cursor:pointer;position:relative;display:grid;place-items:center;font-size:12px;color:#d9cba4;overflow:hidden;padding:4px}
.piece.sel{outline:3px solid var(--goldb);outline-offset:2px}
.piece svg{position:absolute;inset:0;width:100%;height:100%}
.piece .pn{position:absolute;top:3px;left:5px;font-weight:800;color:var(--goldb);z-index:2}
.compass{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:8px;justify-content:center;direction:ltr;margin-bottom:12px}
.fing{width:130px;height:170px;margin:0 auto 14px;border:2px solid var(--blueb);border-radius:12px;background:#07121c;display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer;touch-action:none}
.fing i{font-style:normal;font-size:64px;filter:grayscale(1);opacity:.5}.fing b{position:absolute;left:0;bottom:0;height:5px;background:var(--blueb);width:0}
.shopRow{display:flex;gap:10px;flex-wrap:wrap}
.rate{font-size:34px;letter-spacing:6px;cursor:pointer;color:var(--goldb);direction:ltr}
#mPart2{border-color:var(--goldb);color:var(--goldb)}
#eP2{border-color:var(--goldb);color:var(--goldb)}
#mPart2:hover,#mPart2:focus-visible{background:var(--gold);color:var(--black)}
</style>

const sleep = ms => new Promise(r => setTimeout(r, ms));
const S = (ar, en) => ({ ar, en });
const lerp = (a, b, t) => a + (b - a) * t;
function rnd(seed) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

let ST = Object.assign({}, DEF);
try { Object.assign(ST, JSON.parse(localStorage.getItem('lm_settings') || '{}')); } catch (e) {}
function saveST() { try { localStorage.setItem('lm_settings', JSON.stringify(ST)); } catch (e) {} }

const TR = {}; // extra-language table: TR.fr[enString] = translation
function isRTL() { return ST.lang === 'ar'; }
function tx(o) {
  if (o == null) return ''; if (typeof o === 'string') return o;
  if (ST.lang !== 'ar' && ST.lang !== 'en') { const t = TR[ST.lang]; if (t && o.en && t[o.en]) return t[o.en]; return o.en || o.ar || ''; }
  return o[ST.lang] || o.ar || '';
}

  slot: S('خانة', 'Slot'), empty: S('فارغة', 'Empty'), overwrite: S('الخانة دي فيها تقدم محفوظ. تمسحه وتبدأ من جديد؟', 'This slot has saved progress. Overwrite it?'),

function openSlots(mode) {
  const keepPart = Save.part;
  $('slotTitle').textContent = mode === 'new' ? u('slotPickNew') : u('slotPickLoad'); const l = $('slotList'); l.innerHTML = '';
  const parts = mode === 'load' ? [1, 2] : [PART];
  parts.forEach(pt => {
    Save.part = pt;
    if (mode === 'load') { const h = document.createElement('div'); h.style.cssText = 'width:min(560px,100%);font-size:14px;letter-spacing:1px;color:var(--goldb);margin-top:6px'; h.textContent = pt === 2 ? tx(S('الجزء الثاني — الابن', 'Part Two — The Son')) : tx(S('الجزء الأول', 'Part One')); l.appendChild(h); }
    let shown = 0;
    [1, 2, 3].forEach(n => {
      const d = Save.read(n); if (mode === 'load' && !d) return; shown++;
      const row = document.createElement('div'); row.className = 'slotRow';
      const c = document.createElement('div'); c.className = 'card' + (d ? '' : ' empty');
      if (d) { const ci = (pt === 2 ? CH_INFO2[d.ch] : CH_INFO[d.ch]) || CH_INFO[1]; c.innerHTML = `<b>${u('slot')} ${n} -- ${u('stCaption')} ${d.ch}: ${tx(ci.name)}</b><div>${pt === 2 ? '' : u('memories') + ': ' + (d.mem || []).length + ' · '}${new Date(d.t).toLocaleString(ST.lang === 'ar' ? 'ar-EG' : 'en-GB')}</div>`; }
      else c.innerHTML = `<b>${u('slot')} ${n}</b><div>${u('empty')}</div>`;
      c.onclick = async () => {
        AU.sfx('click');
        if (mode === 'new') { if (d && !(await askYesNo(UI.overwrite))) return; $('s-slots').classList.remove('on'); startNewGame(n); }
        else { if (!d) { AU.sfx('err'); return; } $('s-slots').classList.remove('on'); if (PART !== pt) setPart(pt); Save.part = pt; loadGame(n); }
      };
      row.appendChild(c);
      if (d) { const x = document.createElement('button'); x.className = 'btn sec del'; x.textContent = '✕'; x.onclick = async () => { if (await askYesNo(UI.delSlot)) { Save.part = pt; Save.del(n); refreshMenuState(); openSlots(mode); } }; row.appendChild(x); }
      l.appendChild(row);
    });
    if (mode === 'load' && !shown) { const e = document.createElement('div'); e.className = 'card empty'; e.style.cssText = 'width:min(560px,100%);padding:14px 20px;font-size:13px;color:var(--ghost)'; e.textContent = u('empty'); l.appendChild(e); }
  });
  Save.part = mode === 'load' ? keepPart : PART;
  showBase('s-slots');
}

  if (!has(id)) G.inv.push(id); renderInv(); noteTick(); AU.sfx('pick'); AU.vib(30);

  const m = Save.meta(); if (m.ach[id]) return; const a = allAch().find(x => x.id === id); if (!a) return;
  m.ach[id] = 1; Save.setMeta(m); achToast(a); buildAbout(); if (id !== 'complete') setTimeout(checkAch, 50);

function snapChapter(n) { G.snaps = G.snaps || {}; G.snaps[n] = { room: G.room, x: G.x, flags: JSON.parse(JSON.stringify(G.flags || {})), inv: (G.inv || []).slice(), visited: Object.assign({}, G.visited || {}), chSec: G.chSec || 0 }; }
async function goBackChapter() {
  const n = G.ch - 1, sn = G.snaps && G.snaps[n]; if (!sn || G.mode === 'busy') return;
  G.mode = 'busy'; snapChapter(G.ch); G.snaps[G.ch].fwd = true; AU.sfx('door');

}

/* ---------- map (SVG per chapter) ---------- */
function roomNameIn(ch, id) {
  const C = CHAPS()[ch]; let nm = null;
  Object.keys(C.rooms).forEach(r => C.rooms[r].objs.forEach(o => { if (!nm && o.to === id && o.label && r !== id) nm = o.label; }));
  return C.rooms[id].name || nm || (id === C.start ? C.name : null) || S(id, id);
}
function openMap() {
  if (!G || !G.room) return; const C = CHAPS()[G.ch], ids = Object.keys(C.rooms);
  const lvl = {}, q = [C.start]; lvl[C.start] = 0;
  while (q.length) { const a = q.shift(); C.rooms[a].objs.forEach(o => { if (o.to && C.rooms[o.to] && lvl[o.to] == null) { lvl[o.to] = lvl[a] + 1; q.push(o.to); } }); }
  ids.forEach(i => { if (lvl[i] == null) lvl[i] = 0; });
  const cols = {}; ids.forEach(i => (cols[lvl[i]] = cols[lvl[i]] || []).push(i));
  const maxL = Math.max(...Object.keys(cols).map(Number)), maxN = Math.max(...Object.values(cols).map(a => a.length));
  const cw = 168, ch = 96, W = (maxL + 1) * cw + 40, H = maxN * ch + 40, pos = {};
  Object.keys(cols).forEach(l => cols[l].forEach((i, k) => { const nx = ST.lang === 'ar' ? (maxL - l) : +l; pos[i] = [20 + nx * cw + 70, 20 + k * ch + 36 + (maxN - cols[l].length) * ch / 2]; }));
  let svg = `<svg id="mapSvg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${H}" fill="#0f0f12"/>`;
  const seen = new Set();
  ids.forEach(a => C.rooms[a].objs.forEach(o => { if (o.to && pos[o.to]) { const k = [a, o.to].sort().join('|'); if (seen.has(k)) return; seen.add(k); const [x1, y1] = pos[a], [x2, y2] = pos[o.to]; const known = G.visited[a] || G.visited[o.to]; svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${known ? '#6a5a3a' : '#2a2a30'}" stroke-width="3" ${known ? '' : 'stroke-dasharray="6 6"'}/>`; } }));
  ids.forEach(i => {
    const [x, y] = pos[i], vis = G.visited[i], cur = G.room === i, nm = vis ? tx(roomNameIn(G.ch, i)) : '?';
    svg += `<g><rect x="${x - 62}" y="${y - 28}" width="124" height="56" rx="10" fill="${cur ? '#3a3020' : vis ? '#1a1a1f' : '#0c0c0e'}" stroke="${cur ? '#b89c5e' : vis ? '#4a4a52' : '#2a2a30'}" stroke-width="${cur ? 3 : 1.5}" ${vis ? '' : 'stroke-dasharray="5 5"'}/>
      <text x="${x}" y="${y + 5}" text-anchor="middle" font-size="${vis ? 16 : 24}" fill="${vis ? '#d4d0c8' : '#4a4a52'}" font-family="Cairo,Lora,sans-serif">${nm}</text>${cur ? `<circle cx="${x + 50}" cy="${y - 18}" r="6" fill="#e0b45a"><animate attributeName="r" values="4;8;4" dur="1.6s" repeatCount="indefinite"/></circle>` : ''}</g>`;
  });
  svg += '</svg>';
  const vc = ids.filter(i => G.visited[i]).length;
  $('mapBody').innerHTML = `<div class="note" style="text-align:center;margin-bottom:10px">${u('stCaption')} ${G.ch} — ${tx(CHAPS()[G.ch].name)} · ${vc}/${ids.length} ${ST.lang === 'ar' ? 'غرف مكتشفة' : 'rooms found'}</div>` + svg;
  ov('s-map', true);
}

function pzOrder(title, desc, items) {
  if (LM.auto) return Promise.resolve(LM.autoPin !== false);
  return new Promise(res => {
    const n = items.length; let order = items.map((_, i) => i).reverse(); if (n > 3) { const t = order[0]; order[0] = order[1]; order[1] = t; } let sel = -1;
    const prev = pzOpen(`<h3>${tx(title)}</h3><p>${tx(desc)}</p><div id="ordList"></div><div class="pzMsg" id="pzMsg"></div><div class="pzBtns"><button class="btn" id="pzOk">${u('confirm')}</button><button class="btn sec" id="pzCancel">${u('close')}</button></div>`);
    const draw = () => { const l = $('ordList'); l.innerHTML = ''; order.forEach((k, pos) => { const b = document.createElement('button'); b.className = 'btn sec'; b.style.cssText = 'display:block;width:100%;margin:6px 0;text-align:start;' + (sel === pos ? 'outline:2px solid var(--goldb);' : ''); b.textContent = (pos + 1) + '.  ' + tx(items[k]); b.onclick = () => { AU.sfx('click'); if (sel === -1) sel = pos; else if (sel === pos) sel = -1; else { const t = order[sel]; order[sel] = order[pos]; order[pos] = t; sel = -1; } draw(); }; l.appendChild(b); }); };
    draw();
    $('pzOk').onclick = () => { if (order.every((k, i) => k === i)) { AU.sfx('ok'); pzClose(prev); res(true); } else { AU.sfx('err'); AU.vib(120); $('pzMsg').textContent = u('wrong'); } };
    $('pzCancel').onclick = () => { pzClose(prev); res(false); };

$('eMenu').addEventListener('click', toMenu);

/* ---------- boot ---------- */
function makeGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'), id = x.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0); $('fxGrain').style.backgroundImage = `url(${c.toDataURL()})`;
}
async function boot() {
  makeGrain(); applyLang(); applySettings(); resize(); requestAnimationFrame(frame); updateHintBtn();
  const bar = $('ldBar'), pct = $('ldPct'); pct.textContent = u('loading');
  const fonts = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, sleep(2500)]) : Promise.resolve();
  let p = 0; const t0 = performance.now();
  await new Promise(res => { const iv = setInterval(() => { p = Math.min(100, ((performance.now() - t0) / 1900) * 100); bar.style.width = p + '%'; if (p >= 100) { clearInterval(iv); res(); } }, 60); });
  await fonts; refreshMenuState(); applyLang();
  pct.innerHTML = `<span id="tapgo">${u('tap')}</span>`;
  const go = () => {
    $('s-load').removeEventListener('pointerdown', go); AU.init(); AU.resume(); goFull(); AU.heart(2, 60);
    showBase('s-menu'); AU.startMusic('menu'); AU.ambient('rain');
  };
  $('s-load').addEventListener('pointerdown', go); window.addEventListener('keydown', function k(e) { if ($('s-load').classList.contains('on')) { go(); } window.removeEventListener('keydown', k); });
}
// debug / test hook
LM.state = () => G; LM.use = id => { const o = curRoom().objs.find(x => x.id === id); return interact(o); };
LM.go = (room, x) => { G.room = room; G.x = x || 200; G.visited[room] = 1; snapCam(); };
LM.begin = async (n) => { await startFromChapterScreen(n); };
LM.newGame = startNewGame; LM.setPart = setPart;
try{ if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
boot();

</script>
